<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="쉬프터즈 — 브랜드 빌딩과 콘텐츠 크리에이티브 파트너">

  <title>쉬프터즈 SHIFTERS — 브랜드·콘텐츠 크리에이티브 파트너</title>

  <!-- 공통 스타일 다음에 페이지 스타일을 연결합니다. -->
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/mainpage.css">

  <!-- HTML이 준비된 뒤 실행합니다. -->
  <script src="./js/common.js" defer></script>
  <script src="./js/mainpage.js" defer></script>
</head>

<body data-theme="light">
    <!-- 변경: 페이지 이동 링크를 확장자 없는 서버 경로(/, /works, /about, /contact)로 통일했습니다. -->
  <a class="skip-link" href="#main-content">본문 바로가기</a>

  <!-- 공통 헤더 -->
  <header class="site-header" id="page-top">
    <div class="container site-header__inner">
      <a class="site-brand" href="/" aria-label="SHIFTERS 홈">
        SHIFTERS
      </a>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" hidden>
        <span class="menu-toggle__label">메뉴 열기</span>

        <span class="menu-toggle__icon" aria-hidden="true">
          <span></span>
          <span></span>
        </span>
      </button>

      <nav class="site-nav" id="site-navigation" aria-label="메인 메뉴">
        <a class="site-nav__link" href="/works">WORKS</a>
        <a class="site-nav__link" href="/about">ABOUT</a>
        <a class="site-nav__link" href="/contact">CONTACT</a>
      </nav>
    </div>
  </header>

  <!-- 첫 화면 전용 콘텐츠 -->
  <main class="site-main home-page" id="main-content" tabindex="-1">
    <h1 class="home-page__title">
      SHIFTERS — Brand & Content Creative Partner
    </h1>

    <div class="stage">
      <svg class="hero-art" role="img" aria-labelledby="hero-title hero-description" xmlns="http://www.w3.org/2000/svg"
        width="1440" height="900" viewBox="0 0 1440 900">
        <title id="hero-title">SHIFTERS</title>
        <desc id="hero-description">
          PRESS THE SHIFT KEY — CREATIVE PARTNER
        </desc>

        <defs>
          <clipPath id="logo-reveal">
            <rect id="logo-mask" x="0" y="0" width="1440" height="900" />
          </clipPath>

          <clipPath id="prompt-reveal">
            <rect id="prompt-mask" x="0" y="0" width="1440" height="900" />
          </clipPath>

          <clipPath id="hero-crop">
            <rect width="1440" height="900" />
          </clipPath>
        </defs>

        <!-- 기존 차콜 배경 -->
        <g id="Charcoal-background" clip-path="url(#hero-crop)">
          <rect width="1440" height="900" fill="#242424" />

          <image id="Original-brand-charcoal-texture" x="-280" y="-130" width="2000" height="3262.032"
            preserveAspectRatio="none" href="./image/shifters_logo.webp" />

          <rect width="1440" height="900" fill="#000" opacity="0.20" />
        </g>

        <!-- 기존 SVG 메뉴는 공통 HTML 헤더로 옮겼습니다. -->

        <g id="Hero-logo">
          <text id="SHIFTERS-editable-source" clip-path="url(#logo-reveal)" x="720" y="440" fill="#fff"
            font-family="Telegraf, Arial Black, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="6"
            text-anchor="middle">SHIFTERS</text>
        </g>

        <g id="Shift-key-prompt">
          <text id="PRESS-THE-SHIFT-KEY" clip-path="url(#prompt-reveal)" x="720" y="499" fill="#fff"
            font-family="Telegraf, Arial, sans-serif" font-size="18" letter-spacing="6" text-anchor="middle">PRESS THE
            SHIFT KEY</text>
        </g>

        <text id="Brand-description" x="720" y="520" fill="#fff" font-family="Telegraf, Arial, sans-serif"
          font-size="14" letter-spacing="4" text-anchor="middle">CREATIVE PARTNER</text>

        <rect id="animated-caret" x="0" y="0" width="2" height="20" fill="#fff" aria-hidden="true" />
      </svg>

    </div>
    <section class="home-work-cta" aria-label="작업물 보기">
      <a class="text-link" href="/works">VIEW WORK <span aria-hidden="true">↗</span></a>
    </section>
  </main>

  <!-- 공통 푸터 -->
  <footer class="site-footer">
    <div class="container">
      <div class="site-footer__top">
        <a class="site-brand" href="/" aria-label="SHIFTERS 홈">
          SHIFTERS
        </a>

        <a class="site-footer__email" href="mailto:hello@shift-ers.com">
          hello@shift-ers.com
          <span aria-hidden="true">↗</span>
        </a>
      </div>

      <div class="site-footer__bottom">
<!--        <p>CREATIVE PARTNER</p>-->
<!--        <p>PRESS THE SHIFT KEY.</p>-->
      </div>
    </div>
  </footer>
  <!-- 변경: CONTACT와 같은 고정 TOP 버튼으로 페이지 맨 위로 이동합니다. -->
  <a class="page-top-button" href="#page-top" aria-label="페이지 맨 위로 이동">TOP</a>
</body>

</html>
