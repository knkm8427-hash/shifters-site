<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="쉬프터즈(SHIFTERS) 프로젝트 포트폴리오 — 브랜드 필름, 릴스 기획·제작, 퍼스널 브랜딩, 인플루언서 시딩">
    <title>WORKS — 쉬프터즈 SHIFTERS 포트폴리오</title>

    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/portfolio.css">
    <script src="./js/common.js" defer></script>
  <script src="./js/works-pagination.js" defer></script>
  <script src="./js/portfolio.js" defer></script>
</head>

<body data-theme="light">
    <!-- 변경: 페이지 이동 링크를 확장자 없는 서버 경로(/, /works, /about, /contact)로 통일했습니다. -->
    <a class="skip-link" href="#main-content">본문 바로가기</a>

    <header class="site-header" id="page-top">
        <div class="container site-header__inner">
            <a class="site-brand" href="/" aria-label="SHIFTERS 홈">SHIFTERS</a>

            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" hidden>
                <span class="menu-toggle__label">메뉴 열기</span>
                <span class="menu-toggle__icon" aria-hidden="true">
                    <span></span>
                    <span></span>
                </span>
            </button>

            <nav class="site-nav" id="site-navigation" aria-label="메인 메뉴">
                <a class="site-nav__link" href="/works" aria-current="page">WORKS</a>
                <a class="site-nav__link" href="/about">ABOUT</a>
                <a class="site-nav__link" href="/contact">CONTACT</a>
            </nav>
        </div>
    </header>

    <main class="site-main" id="main-content" tabindex="-1">
      <section class="portfolio-section container" aria-labelledby="works-title">
        <div class="portfolio-heading">
          <div><p class="section-label">BRAND &amp; CONTENT</p><h1 class="section-title" id="works-title">WORKS</h1></div>
          <p class="portfolio-count"><!--WORKS_COUNT--> PROJECTS</p>
        </div>
        
        <div class="work-grid">
<!--WORKS_GRID-->
        </div>
        <nav class="work-pagination" aria-label="작업 목록 페이지"></nav>
      </section>
    </main>


    <footer class="site-footer">
        <div class="container">
<!--            <p>SPRESS THE SHIFT KEY.</p>-->
        </div>
    </footer>
  <dialog class="work-dialog" id="work-dialog" aria-labelledby="work-dialog-title">
  <div class="work-dialog__inner">
    <header class="work-dialog__header">
      <div><p class="section-label">SHIFTERS / FILM</p><h2 id="work-dialog-title"></h2></div>
      <button type="button" class="work-dialog__close" aria-label="영상 모달 닫기" autofocus>닫기 ×</button>
    </header>
    <video class="work-dialog__video" controls playsinline preload="none" aria-label="전체 작업 영상"></video>
    <button type="button" class="work-dialog__play" hidden>전체 영상 재생 ▶</button>
    <p class="work-dialog__status" role="status" aria-live="polite"></p>
    <footer class="work-dialog__footer">
      <span class="work-dialog__date"></span>
      <a class="work-dialog__instagram" target="_blank" rel="noopener noreferrer" hidden>Instagram에서 보기 ↗</a>
    </footer>
  </div>
</dialog>
  <!-- 변경: CONTACT와 같은 고정 TOP 버튼으로 페이지 맨 위로 이동합니다. -->
  <a class="page-top-button" href="#page-top" aria-label="페이지 맨 위로 이동">TOP</a>
</body>

</html>
