name: 인스타 동기화 + 홈페이지 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다 (UTC 기준)
  workflow_dispatch: {}      # Actions 탭에서 "Run workflow" 로 바로 실행 가능

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow

      - name: 인스타그램 게시물 가져오기
        if: ${{ env.IG_ACCESS_TOKEN != '' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/sync_instagram.py

      - name: 새 게시물·썸네일 저장
        run: |
          git config user.name "shifters-bot"
          git config user.email "bot@shift-ers.com"
          git add data/works.json media/posters
          git diff --cached --quiet || git commit -m "인스타 포트폴리오 자동 갱신 [skip ci]"
          git push || true

      - name: 사이트 만들기
        run: python3 scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

env:
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
